<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 타점</title>
<style>
  :root{
    --bg:#F3F5F8; --card:#FFF; --ink:#121820; --ink2:#57657A; --ink3:#8A98AC;
    --line:#DDE3EB; --accent:#0D6570;
    --buy:#1B6E52; --buyBg:#DDEEE6; --sell:#A2372E; --sellBg:#F5DFDC;
    --hold:#6B7A8C; --holdBg:#E6EAF0; --warn:#8A6212; --warnBg:#F6EACF;
    /* 등락 색: 한국은 상승 빨강, 미국은 상승 초록 */
    --krUp:#C0392B; --krDown:#1F5FA8; --usUp:#1B6E52; --usDown:#C0392B;
    /* 그래프 색 (색각이상 검증 통과) */
    --cPrice:#0092AB; --cPriceSoft:#7FC9D6; --cStop:#B33228; --cTarget:#14A369;
    --cSurface:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0C1118; --card:#141C25; --ink:#E8EEF5; --ink2:#AFBCCB; --ink3:#7C8B9C;
      --line:#26313D; --accent:#5FC6D0;
      --buy:#58BE95; --buyBg:#123529; --sell:#E38077; --sellBg:#3A1D1A;
      --hold:#8C9AAB; --holdBg:#1E2833; --warn:#DDB25A; --warnBg:#33290F;
      --krUp:#E5715F; --krDown:#6BA3E0; --usUp:#58BE95; --usDown:#E5715F;
      --cPrice:#22A3BC; --cPriceSoft:#3E6A78; --cStop:#BF4C42; --cTarget:#2FA875;
      --cSurface:#141C25;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}

  header{margin-bottom:18px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .manage{font-size:13px;color:var(--accent);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:5px 12px;white-space:nowrap}
  .manage:hover{border-color:var(--accent)}
  .manage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  .updated{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

  .banner{display:none;background:var(--warnBg);color:var(--warn);border-radius:8px;
    padding:11px 14px;font-size:13.5px;font-weight:600;margin:12px 0}
  .banner.show{display:block}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin:16px 0 14px}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 8px;text-align:center}
  .sum b{display:block;font-size:21px;line-height:1.2}
  .sum span{font-size:11.5px;color:var(--ink3)}

  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;font:inherit;font-size:15px;padding:10px 36px 10px 13px;
    border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
  .search input::placeholder{color:var(--ink3)}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:none;background:none;color:var(--ink3);font:inherit;font-size:17px;
    cursor:pointer;padding:4px 8px;line-height:1;display:none}
  .search.filled button{display:block}

  .filters{display:flex;gap:7px;margin-bottom:16px;overflow-x:auto;
    padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--ink2);
    cursor:pointer;white-space:nowrap;flex:none}
  .filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:14px 15px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .nm{font-weight:650;font-size:16px;letter-spacing:-.01em}
  .code{font-size:12px;color:var(--ink3);margin-left:6px;font-variant-numeric:tabular-nums}
  .px{text-align:right;white-space:nowrap}
  .px b{font-size:16px;font-weight:650}
  .px i{display:block;font-style:normal;font-size:12.5px;font-variant-numeric:tabular-nums}
  .kr-up{color:var(--krUp)} .kr-down{color:var(--krDown)}
  .us-up{color:var(--usUp)} .us-down{color:var(--usDown)}
  .flat{color:var(--ink3)}

  .verdict{display:inline-block;font-size:12px;font-weight:650;padding:3px 10px;
    border-radius:5px;margin-top:9px}
  .v-적극매수,.v-분할매수{background:var(--buyBg);color:var(--buy)}
  .v-매도,.v-비중축소{background:var(--sellBg);color:var(--sell)}
  .v-관망{background:var(--holdBg);color:var(--hold)}
  .v-데이터없음{background:var(--warnBg);color:var(--warn)}
  .score{font-size:12px;color:var(--ink3);margin-left:7px;font-variant-numeric:tabular-nums}

  /* ── 그래프 ── */
  .chart{margin-top:13px;position:relative}
  .chart svg{display:block;width:100%;height:92px;touch-action:pan-y}
  .readout{position:absolute;top:0;right:0;font-size:11.5px;color:var(--ink2);
    background:var(--card);padding:1px 5px;border-radius:4px;
    font-variant-numeric:tabular-nums;pointer-events:none;opacity:0;transition:opacity .12s}
  .chart.hovering .readout{opacity:1}
  .legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:7px;font-size:11px;color:var(--ink2)}
  .legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .legend i{width:12px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
  .range{font-size:11px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}

  .lv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
  .lv div{background:var(--card);padding:8px 6px;text-align:center}
  .lv span{display:block;font-size:10.5px;color:var(--ink3);margin-bottom:2px}
  .lv b{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:600}
  .lv .st b{color:var(--sell)} .lv .tg b{color:var(--buy)}

  /* 카드 머리를 눌러 상세를 펼칩니다 */
  .head{width:100%;text-align:left;background:none;border:none;padding:0;
    font:inherit;color:inherit;cursor:pointer;display:block}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
  .chev{font-size:12px;color:var(--ink3);margin-left:6px;display:inline-block;
    transition:transform .18s}
  .head[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .detail{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
  .detail.open{display:block}
  .dtitle{font-size:11px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;
    margin:0 0 7px}
  table.spec{width:100%;border-collapse:collapse;font-size:13px}
  table.spec th{text-align:left;font-weight:400;color:var(--ink3);padding:5px 0;width:44%}
  table.spec td{text-align:right;padding:5px 0;font-variant-numeric:tabular-nums;font-weight:600}
  table.spec tr+tr th,table.spec tr+tr td{border-top:1px solid var(--line)}

  ul.why{margin:9px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink2)}
  ul.why li{margin-bottom:3px}

  .news{margin-top:16px}
  .news a{display:block;text-decoration:none;color:inherit;padding:8px 0;
    border-top:1px solid var(--line)}
  .news a:first-of-type{border-top:none}
  .news a:hover .nt{color:var(--accent)}
  .news a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .nt{font-size:13.5px;line-height:1.5;display:block}
  .nm2{font-size:11.5px;color:var(--ink3);margin-top:2px;display:block}
  .nonews{font-size:12.5px;color:var(--ink3);padding:6px 0}

  .demote{font-size:12.5px;color:var(--warn);margin-top:8px}
  .err{font-size:12.5px;color:var(--sell);margin-top:8px;word-break:break-all}

  footer{margin-top:26px;font-size:12px;color:var(--ink3);line-height:1.7;
    border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <h1>오늘의 타점</h1>
      <a class="manage" href="manage.html">종목 관리</a>
    </div>
    <p class="updated" id="updated">불러오는 중…</p>
  </header>

  <div class="banner" id="banner"></div>
  <div class="summary" id="summary"></div>

  <div class="search" id="searchBox">
    <input type="search" id="q" placeholder="종목 이름이나 코드로 검색" autocomplete="off"
           aria-label="종목 검색">
    <button type="button" id="clearQ" aria-label="검색어 지우기">✕</button>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>

  <footer>
    이 페이지는 개인용 참고 도구입니다. 표시된 판정과 가격은 과거 데이터에 규칙을 적용한 계산 결과일 뿐
    투자 자문이 아니며, 어떤 수익도 보장하지 않습니다. 매매 판단과 그 결과는 본인 책임입니다.
  </footer>
</div>

<script>
const FILTERS = ["전체","매수","매도","관망","한국","미국"];
let DATA = null, active = "전체", query = "";

const fmt = (v, cur) => v == null ? "—"
  : cur === "KRW" ? Math.round(v).toLocaleString("ko-KR")
  : v.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

const esc = s => String(s ?? "").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function changeClass(pct, market){
  if (pct == null || pct === 0) return "flat";
  return (market === "KR" ? "kr" : "us") + (pct > 0 ? "-up" : "-down");
}

function matches(it){
  if (query){
    const hay = (it.name + " " + it.code).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  if (active === "전체") return true;
  if (active === "매수")  return it.verdict === "적극매수" || it.verdict === "분할매수";
  if (active === "매도")  return it.verdict === "매도" || it.verdict === "비중축소";
  if (active === "관망")  return it.verdict === "관망";
  if (active === "한국")  return it.market === "KR";
  if (active === "미국")  return it.market === "US";
  return true;
}

/* ── 그래프 ──────────────────────────────────────────────
   종가선과 200일선은 같은 색의 진한/옅은 단계로 구분합니다.
   손절·목표는 상태색 가로선이고, 색만으로 구분하지 않도록 범례에 이름을 답니다. */
const W = 320, H = 88, PAD = 4;

function chartHTML(it){
  const s = (it.hist || []).filter(v => v != null);
  if (s.length < 5) return "";
  const ma = it.hist_ma200 || [];
  const vals = s.slice();
  ma.forEach(v => { if (v != null) vals.push(v); });
  [it.stop, it.target].forEach(v => { if (v != null) vals.push(v); });

  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (!(hi > lo)) { hi = lo + 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;

  const n = it.hist.length;
  const X = i => PAD + (i / (n - 1)) * (W - PAD * 2);
  const Y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - PAD * 2);

  const pts = arr => arr.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`)
                        .filter(Boolean).join(" ");

  const closePts = pts(it.hist);
  const maPts = pts(ma);
  const lastI = it.hist.length - 1, lastV = it.hist[lastI];

  const hline = (v, color, id) => v == null ? "" :
    `<line x1="${PAD}" y1="${Y(v).toFixed(1)}" x2="${W - PAD}" y2="${Y(v).toFixed(1)}"
       stroke="${color}" stroke-width="1" vector-effect="non-scaling-stroke" data-h="${id}"/>`;

  const area = `M ${PAD},${H - PAD} L ${closePts.split(" ").join(" L ")} L ${(W - PAD)},${H - PAD} Z`;

  return `<div class="chart" data-lo="${lo}" data-hi="${hi}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${esc(it.name)} 최근 ${n}거래일 종가와 200일 이동평균">
      <path d="${area}" fill="var(--cPrice)" fill-opacity="0.1"/>
      ${hline(it.stop, "var(--cStop)", "stop")}
      ${hline(it.target, "var(--cTarget)", "target")}
      ${maPts ? `<polyline points="${maPts}" fill="none" stroke="var(--cPriceSoft)"
         stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
         vector-effect="non-scaling-stroke"/>` : ""}
      <polyline points="${closePts}" fill="none" stroke="var(--cPrice)"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke"/>
      <circle cx="${X(lastI).toFixed(1)}" cy="${Y(lastV).toFixed(1)}" r="4"
        fill="var(--cPrice)" stroke="var(--cSurface)" stroke-width="2"
        vector-effect="non-scaling-stroke"/>
      <line class="cross" x1="0" y1="0" x2="0" y2="${H}" stroke="var(--ink3)"
        stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>
    </svg>
    <div class="readout"></div>
    <div class="legend">
      <span><i style="border-color:var(--cPrice)"></i>종가</span>
      ${maPts ? `<span><i style="border-color:var(--cPriceSoft)"></i>200일선</span>` : ""}
      ${it.stop != null ? `<span><i style="border-color:var(--cStop)"></i>손절</span>` : ""}
      ${it.target != null ? `<span><i style="border-color:var(--cTarget)"></i>목표</span>` : ""}
    </div>
    <p class="range">${esc(it.hist_from || "")} → ${esc(it.last_date || "")} · ${n}거래일</p>
  </div>`;
}

function cardHTML(it){
  const cur = it.currency || (it.market === "KR" ? "KRW" : "USD");
  const cls = changeClass(it.change_pct, it.market);
  const sign = it.change_pct > 0 ? "+" : "";
  const vkey = (it.verdict || "").replace(/\s/g,"");

  const price = it.close == null ? `<i class="flat">데이터 없음</i>`
    : `<b>${fmt(it.close, cur)}</b><i class="${cls}">${sign}${(it.change_pct ?? 0).toFixed(2)}%</i>`;

  const levels = it.entry == null ? "" : `
    <div class="lv">
      <div><span>진입</span><b>${fmt(it.entry, cur)}</b></div>
      <div class="st"><span>손절</span><b>${fmt(it.stop, cur)}</b></div>
      <div class="tg"><span>목표</span><b>${fmt(it.target, cur)}</b></div>
      <div><span>손익비</span><b>${it.rr == null ? "—" : it.rr.toFixed(2)}</b></div>
    </div>`;

  const row = (k, v) => v == null || v === "" ? ""
    : `<tr><th>${k}</th><td>${v}</td></tr>`;

  const spec = `<table class="spec">
    ${row("현재가", fmt(it.close, cur))}
    ${row("20일선", fmt(it.ma20, cur))}
    ${row("200일선", fmt(it.ma200, cur))}
    ${row("RSI (14)", it.rsi14 == null ? null : it.rsi14.toFixed(1))}
    ${row("ATR (14)", fmt(it.atr14, cur))}
    ${row("목표가 기준", it.target_basis ? esc(it.target_basis) : null)}
    ${row("데이터", it.last_date ? `${esc(it.last_date)} · ${it.bars ?? 0}봉` : null)}
  </table>`;

  const why = (it.reasons && it.reasons.length)
    ? `<ul class="why">${it.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "";

  const news = (it.news && it.news.length)
    ? it.news.map(a => `<a href="${esc(a.u)}" target="_blank" rel="noopener">
         <span class="nt">${esc(a.t)}</span>
         <span class="nm2">${esc([a.s, a.d].filter(Boolean).join(" · "))}</span></a>`).join("")
    : `<p class="nonews">아직 받아온 기사가 없습니다. 장 마감 후 실행에서 채워집니다.</p>`;

  return `<div class="card" data-cur="${cur}">
    <button class="head" type="button" aria-expanded="false">
      <div class="top">
        <div><span class="nm">${esc(it.name)}</span><span class="code">${esc(it.code)}</span
          ><span class="chev">▾</span></div>
        <div class="px">${price}</div>
      </div>
    </button>
    <span class="verdict v-${vkey}">${esc(it.verdict)}</span>
    ${it.score != null ? `<span class="score">${it.score > 0 ? "+" : ""}${it.score}점</span>` : ""}
    ${it.demoted_reason ? `<div class="demote">${esc(it.demoted_reason)}</div>` : ""}
    ${it.error ? `<div class="err">${esc(it.error)}</div>` : ""}
    ${chartHTML(it)}
    ${levels}
    <div class="detail">
      <p class="dtitle">지표</p>
      ${spec}
      ${why}
      <div class="news">
        <p class="dtitle">뉴스</p>
        ${news}
      </div>
    </div>
  </div>`;
}

function render(){
  const d = DATA;
  document.getElementById("updated").textContent = "마지막 갱신 " + d.generated_at_display;

  const ageH = (Date.now() - new Date(d.generated_at).getTime()) / 36e5;
  const banner = document.getElementById("banner");
  const msgs = [];
  if (ageH > 24) msgs.push(`${Math.floor(ageH/24)}일 넘게 갱신되지 않았습니다. 자동 실행을 확인하세요.`);
  if (d.failed > 0) msgs.push(`${d.failed}개 종목의 데이터를 받지 못했습니다.`);
  banner.textContent = msgs.join(" ");
  banner.classList.toggle("show", msgs.length > 0);

  const c = v => d.items.filter(i => i.verdict === v).length;
  document.getElementById("summary").innerHTML = [
    ["매수", c("적극매수") + c("분할매수"), "var(--buy)"],
    ["매도", c("매도") + c("비중축소"), "var(--sell)"],
    ["관망", c("관망"), "var(--ink2)"],
    ["종목", d.total, "var(--ink2)"]
  ].map(([l,n,col]) =>
    `<div class="sum"><b style="color:${col}">${n}</b><span>${l}</span></div>`).join("");

  const shown = d.items.filter(matches);
  document.getElementById("list").innerHTML = shown.length === 0
    ? `<div class="card" style="text-align:center;color:var(--ink3)">${
        query ? `“${esc(query)}”에 해당하는 종목이 없습니다` : "해당하는 종목이 없습니다"}</div>`
    : shown.map(cardHTML).join("");
}

/* ── 그래프 위에서 값 읽기 (마우스·터치 공용) ── */
function attachHover(){
  document.getElementById("list").addEventListener("pointermove", e => {
    const chart = e.target.closest(".chart");
    if (!chart) return;
    const svg = chart.querySelector("svg");
    const card = chart.closest(".card");
    const idx = [...card.parentNode.children].indexOf(card);
    const it = DATA.items.filter(matches)[idx];
    if (!it || !it.hist) return;

    const r = svg.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const n = it.hist.length;
    const i = Math.round(frac * (n - 1));
    const v = it.hist[i];
    if (v == null) return;

    const lo = +chart.dataset.lo, hi = +chart.dataset.hi;
    const cross = svg.querySelector(".cross");
    const x = PAD + (i / (n - 1)) * (W - PAD * 2);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x);
    cross.setAttribute("opacity", "0.35");

    const ago = n - 1 - i;
    chart.querySelector(".readout").textContent =
      `${fmt(v, card.dataset.cur)} · ${ago === 0 ? "최근" : ago + "거래일 전"}`;
    chart.classList.add("hovering");
  });

  document.getElementById("list").addEventListener("pointerleave", () => {
    document.querySelectorAll(".chart.hovering").forEach(ch => {
      ch.classList.remove("hovering");
      ch.querySelector(".cross").setAttribute("opacity", "0");
    });
  }, true);
}

/* ── 카드 펼치기 ── */
document.getElementById("list").addEventListener("click", e => {
  const head = e.target.closest(".head"); if (!head) return;
  const open = head.getAttribute("aria-expanded") === "true";
  head.setAttribute("aria-expanded", String(!open));
  head.closest(".card").querySelector(".detail").classList.toggle("open", !open);
});

/* ── 검색과 필터 ── */
const qInput = document.getElementById("q");
const searchBox = document.getElementById("searchBox");
let debounce;
qInput.addEventListener("input", () => {
  searchBox.classList.toggle("filled", qInput.value.length > 0);
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = qInput.value.trim().toLowerCase(); render(); }, 120);
});
document.getElementById("clearQ").addEventListener("click", () => {
  qInput.value = ""; query = ""; searchBox.classList.remove("filled"); render(); qInput.focus();
});

document.getElementById("filters").innerHTML =
  FILTERS.map(f => `<button aria-pressed="${f===active}" data-f="${f}">${f}</button>`).join("");
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  active = b.dataset.f;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

fetch("data/latest.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(j => { DATA = j; render(); attachHover(); })
  .catch(e => {
    document.getElementById("updated").textContent = "아직 데이터가 없습니다";
    document.getElementById("banner").innerHTML =
      "첫 계산이 아직 실행되지 않았습니다. 리포지토리의 <b>Actions</b> 탭 → " +
      "<b>daily-signals</b> → <b>Run workflow</b>를 눌러 한 번 실행해 주세요." +
      "<br><span style='font-weight:400;opacity:.75'>(" + e.message + ")</span>";
    document.getElementById("banner").classList.add("show");
  });
</script>
</body>
</html>
